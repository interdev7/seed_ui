name: Release

# Tagging is automatic: bump `version:` in pubspec.yaml, merge to main, and
# this verifies the tree, creates the `v<version>` tag and opens the GitHub
# release from the matching CHANGELOG section.
#
# It all happens in one job on purpose: the release is cut from the very tree
# the checks just passed on, with no second checkout that could drift from it.
#
# Publishing to pub.dev stays manual and is not part of this workflow:
#
#   flutter pub publish
#
# A run that fails opens an issue saying so, and comments on it rather than
# opening another if it fails again. Nothing is tagged or released until every
# check has passed, so a failure means the version is still waiting.
#
# Runs on the built-in GITHUB_TOKEN, so there is no secret to set up. The
# trade-off is attribution: the GitHub release is credited to
# `github-actions[bot]`, because that is the identity the token carries. The
# tag itself is lightweight and records no name at all.
#
# To have releases credited to you instead, add a personal access token as a
# `RELEASE_TOKEN` secret and use it for both `actions/checkout` and
# `gh release create`.
on:
  push:
    branches: [main]
    # The version only ever changes here, so nothing else is worth waking for.
    paths: ["pubspec.yaml"]
  workflow_dispatch:

permissions:
  contents: write
  # Only so a failed run can say so out loud; see the last step.
  issues: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed to tell an already-released version from a new one.
          fetch-depth: 0

      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          version="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          if [ -z "$version" ]; then
            echo "::error::pubspec.yaml has no version:"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Version in pubspec.yaml: $version"

      # Re-running on a commit that touched pubspec for some other reason must
      # not try to release the same version twice.
      - name: Skip versions that are already tagged
        id: guard
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "${{ steps.version.outputs.tag }} already exists — nothing to release."
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.guard.outputs.fresh == 'true'
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.guard.outputs.fresh == 'true'
        run: flutter pub get

      # A release with no changelog entry is a release nobody can read.
      - name: CHANGELOG has an entry for this version
        if: steps.guard.outputs.fresh == 'true'
        run: |
          set -euo pipefail
          grep -q "^## \+${{ steps.version.outputs.version }}\b" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## ${{ steps.version.outputs.version }}' section"
            exit 1
          }

      - name: Analyze
        if: steps.guard.outputs.fresh == 'true'
        run: flutter analyze --fatal-infos

      - name: Test
        if: steps.guard.outputs.fresh == 'true'
        run: flutter test

      # `pub publish` refuses to package a dirty tree, and parts of the
      # toolchain rewrite files in place as they run. Put the tracked files
      # back so the check sees exactly what is committed.
      - name: Show and reset toolchain-modified files
        if: steps.guard.outputs.fresh == 'true'
        run: |
          git status --porcelain
          git diff --stat
          git checkout -- .

      # Catches what pub.dev would reject, so the manual `flutter pub publish`
      # that follows is never a surprise.
      - name: Publish dry run
        if: steps.guard.outputs.fresh == 'true'
        run: flutter pub publish --dry-run

      # A lightweight tag carries no tagger object, so no name or email is
      # recorded on it — there is nothing to attribute to anyone. The release
      # notes live on the GitHub release, so the tag needs no message.
      - name: Tag the release
        if: steps.guard.outputs.fresh == 'true'
        run: |
          set -euo pipefail
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      # The release body is the CHANGELOG section for this version, so the two
      # can never drift apart.
      - name: Extract release notes
        if: steps.guard.outputs.fresh == 'true'
        run: |
          set -euo pipefail
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## +" v "([^0-9.]|$)" { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo '----- release notes -----'
          cat RELEASE_NOTES.md

      - name: Create the GitHub release
        if: steps.guard.outputs.fresh == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A version carrying a hyphen (1.0.0-rc.1) is a pre-release.
          prerelease=''
          case "${{ steps.version.outputs.version }}" in
            *-*) prerelease='--prerelease' ;;
          esac
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file RELEASE_NOTES.md \
            $prerelease

      # A release that dies quietly is a release nobody notices. Versions
      # 0.6.10 and 0.6.11 both failed at the analyze step and went untagged for
      # days, while pub.dev had them, because the only word of it was an e-mail
      # nobody was watching for.
      #
      # An issue is used rather than a webhook because it needs no secret, the
      # workflow already holds a token that can open one, and it stays open
      # until somebody deals with it.
      - name: Say so if the release failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty when the run died before it could read the version.
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          title="Release failed${VERSION:+ for v$VERSION}"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # One issue per stuck release, not one per re-run.
          existing="$(gh issue list --state open --limit 50 \
            --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n1)"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $run_url"
            echo "Commented on #$existing."
            exit 0
          fi

          # Built with printf rather than a heredoc: a heredoc inside a YAML
          # block keeps the indentation, and ten leading spaces would make the
          # whole body a code block.
          printf '%s\n' \
            'The release workflow did not finish, so this version has no tag and no' \
            'GitHub release. Anything already on pub.dev stays there — publishing is' \
            'a separate, manual step.' \
            '' \
            "Run: $run_url" \
            "Commit: \`$GITHUB_SHA\`" \
            '' \
            'Once the cause is fixed and merged, the workflow tags whatever version' \
            '`pubspec.yaml` carries at that moment. A version skipped in the meantime' \
            'needs its tag by hand:' \
            '' \
            '```sh' \
            'git tag v<version> <the commit that carried it>' \
            'git push origin v<version>' \
            '```' > issue-body.md

          gh issue create --title "$title" --body-file issue-body.md
