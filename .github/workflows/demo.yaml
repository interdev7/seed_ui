name: Demo

# Publishes the component gallery to GitHub Pages, so the kit can be tried in
# a browser without installing anything:
#
#   https://interdev7.github.io/seed_ui/
#
# ONE-TIME SETUP, otherwise the `configure-pages` step below fails:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
# Then re-run this workflow (Actions → Demo → Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deployments are not worth queueing: a newer commit supersedes an
# in-flight one. `cancel-in-progress: false` lets a running deploy finish so
# the site is never left half-written.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build gallery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: example
        run: flutter pub get

      # The site is served from a subdirectory, so the base href has to match
      # the repository name or every asset request 404s.
      - name: Build web
        working-directory: example
        run: flutter build web --release --base-href /seed_ui/

      # Pages serves 404.html for unknown paths. Handing it the app shell lets
      # a deep link reach the router instead of a GitHub error page.
      - name: Add SPA fallback
        working-directory: example
        run: cp build/web/index.html build/web/404.html

      # Pages must already be switched on for the repository — see the note at
      # the top of this file. Letting the action enable it (`enablement: true`)
      # needs rights over repository settings that GITHUB_TOKEN is not always
      # granted, and fails the run when it is not.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
