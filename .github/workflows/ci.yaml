name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Format & analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # A Codecov outage is not a reason to block a merge — the tests
          # themselves have already passed by this point.
          fail_ci_if_error: false

  example:
    name: Example builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze
        working-directory: example
        run: flutter analyze

      - name: Test
        working-directory: example
        run: flutter test

      - name: Build web
        working-directory: example
        run: flutter build web --release

  pana:
    name: pub.dev score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # `pub publish` refuses to package a dirty tree, and parts of the
      # toolchain rewrite files in place as they run. Show what moved, then
      # put the tracked files back: what gets validated should be exactly
      # what is committed.
      - name: Show and reset toolchain-modified files
        run: |
          git status --porcelain
          git diff --stat
          git checkout -- .

      # Dry-run publish catches the packaging problems pub.dev would reject:
      # missing LICENSE, a bad version, files that should not ship.
      - name: Publish dry run
        run: flutter pub publish --dry-run

      # pana shells out to libwebp — cwebp, dwebp, gif2webp, webpinfo, webpmux —
      # to build the thumbnails pub.dev shows for `screenshots:`. The runner
      # does not ship them, and without them the screenshot check fails: ten
      # points lost, and an exit code of 127 from the missing binary.
      - name: Install the WebP tools pana needs for screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends webp
          for tool in cwebp dwebp gif2webp webpinfo webpmux; do
            command -v "$tool" >/dev/null || { echo "::error::$tool missing"; exit 1; }
          done

      - name: Install pana
        run: dart pub global activate pana

      - name: Score the package
        run: |
          dart pub global run pana --no-warning --exit-code-threshold 0 .
